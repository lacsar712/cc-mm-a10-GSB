<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>矿井瓦斯班测台</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #1c1917; color: #f5f5f4; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #44403c; }
    nav button { margin-right: 4px; }
    nav button.active { background: #a8a29e; color: #1c1917; font-weight: bold; }
    main { max-width: 820px; margin: 20px auto; padding: 0 12px; }
    input, button { padding: 8px; margin-right: 8px; }
    .alarm { color: #fca5a5; } .ok { color: #86efac; } .muted { color: #a8a29e; }
    #live { min-height: 1.4em; }
    table { width: 100%; border-collapse: collapse; }
    td, th { border-bottom: 1px solid #57534e; padding: 6px; text-align: left; }
    .linklike { background: none; border: none; color: #93c5fd; text-decoration: underline; cursor: pointer; padding: 0; font: inherit; }
    .card { border: 1px solid #57534e; border-radius: 6px; padding: 10px 12px; margin: 8px 0; }
    .card.overdue { border-color: #fca5a5; }
    .card.hilite { outline: 2px solid #fde047; }
    tr.hilite td { background: #713f12; }
    h2 { font-size: 1.05em; margin-top: 20px; }
  </style>
</head>
<body>
  <header>
    <strong>矿井瓦斯班测台</strong>
    <nav>
      <button id="nav-readings" class="active">班测列表</button>
      <button id="nav-tasks">复测任务</button>
    </nav>
    <span id="who"></span>
    <button id="out" hidden>退出</button>
  </header>
  <main>
    <section id="login">
      <p>检查员上报测点甲烷，达到 1% 会立刻推到已打开的页面。这不是图表看板。</p>
      <input id="user" value="gasman" />
      <input id="pass" type="password" value="gas123456" />
      <button id="go">登录</button>
      <p>gasman / gas123456 可上报；viewer / view123456 只能看</p>
    </section>

    <section id="app" hidden>
      <p id="live">等待推送</p>

      <div id="view-readings">
        <form id="form">
          <input id="site" placeholder="测点" />
          <input id="ch4" type="number" step="0.01" placeholder="甲烷 %" />
          <button>上报</button>
        </form>
        <table>
          <thead><tr><th>编号</th><th>测点</th><th>甲烷 %</th><th>状态</th><th>说明</th><th>来源</th><th>操作</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <div id="view-tasks" hidden>
        <h2>待复测</h2>
        <div id="tasks-open" class="muted">暂无</div>
        <h2>逾期栏</h2>
        <div id="tasks-expired" class="muted">暂无</div>
        <h2>已完成</h2>
        <div id="tasks-done" class="muted">暂无</div>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
